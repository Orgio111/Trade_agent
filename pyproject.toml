[project]
name = "quantex"
version = "0.1.0"
description = "QUANTEX Autonomous AI Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "openai>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pandas-ta>=0.3",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "loguru>=0.7.2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Heavyweight, optional time-series forecasting backend (Google TimesFM).
# Loaded lazily by orchestrator.timesfm_forecaster; not required for core use.
forecasting = [
    "timesfm[torch]>=2.0,<3",
]

[project.scripts]
quantex = "main:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
