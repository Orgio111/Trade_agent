[project]
name = "quantex"
version = "0.1.0"
description = "QUANTEX Autonomous AI Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "openai>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pandas-ta>=0.3",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "loguru>=0.7.2",
    "aiohttp>=3.9",
    "nats-py==2.15.0",
    "ccxt==4.5.59",
    "langgraph==1.2.7",
    "prometheus-client==0.25.0",
    "ag2==0.14.0",
    "ollama==0.6.2",
    "fix-busted-json==0.0.19",
]

[project.optional-dependencies]
# Heavyweight, optional time-series forecasting backend (Google TimesFM).
# Loaded lazily by orchestrator.timesfm_forecaster; not required for core use.
forecasting = [
    "timesfm[torch]>=2.0,<3",
]
knowledge = [
    "chromadb==1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.8,<1",
    "mypy>=1.10,<2",
    "types-requests>=2.31",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "xgboost==3.3.0",
    "yfinance==1.5.1",
    "joblib==1.5.3",
    "scikit-learn==1.9.0",
]

[project.scripts]
quantex = "main:cli"
quantex-knowledge = "packages.knowledge.cli:main"
quantex-hermes = "packages.hermes.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
