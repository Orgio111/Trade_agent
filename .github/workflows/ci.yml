name: QUANTEX CI/CD

on:
  push:
    branches: [main, develop, 'claude/**', 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    # Daily midnight retrain check
    - cron: '0 0 * * *'

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.7.1'

jobs:
  # Deterministic, offline integrity gate for code/docs/ownership/embedding drift.
  knowledge-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install integrity-check dependencies
        run: pip install "pydantic>=2.5,<3"

      - name: Verify knowledge manifest and lock
        run: python scripts/knowledge.py check

  # ── Lint & Typecheck ──────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          cd orchestrator && pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check orchestrator/ --exit-zero

      - name: Hermes and knowledge quality gates
        run: |
          ruff check packages/hermes/ packages/knowledge/ scripts/benchmark_hermes.py tests/unit/test_hermes_*.py tests/integration/test_hermes_api.py
          ruff format --check packages/hermes/ packages/knowledge/ scripts/benchmark_hermes.py tests/unit/test_hermes_*.py tests/integration/test_hermes_api.py
          mypy packages/hermes/ --ignore-missing-imports --follow-imports=skip
          mypy packages/knowledge/ --ignore-missing-imports

      - name: MyPy typecheck
        run: mypy orchestrator/ --ignore-missing-imports || true

  # ── Unit Tests ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint, knowledge-integrity]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install uv==0.11.24
          uv sync --frozen --all-extras

      - name: Run tests
        run: |
          uv run --frozen pytest tests/ -v --timeout=60

  # ── ML Model Retrain (scheduled) ──────────────────────
  retrain:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn stable-baselines3
          cd orchestrator && pip install -r requirements.txt

      - name: Fetch data & retrain ML
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        run: |
          python -c "
          import asyncio
          from orchestrator.ml_signals import MLSignalEngine
          from orchestrator.backtest import DataLoader
          from datetime import datetime, timedelta

          async def retrain():
              df = await DataLoader.from_binance_api(
                  'BTCUSDT', '1h',
                  start_time=datetime.now() - timedelta(days=365),
                  end_time=datetime.now(),
              )
              if not df.empty:
                  ml = MLSignalEngine()
                  result = ml.train(df, force=True)
                  ml.save_model()
                  print(f'Retrained: acc={result[\"test_accuracy\"]:.2%}')

          asyncio.run(retrain())
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-model
          path: models/ml_signal_model.pkl
          retention-days: 30

  # ── Build Docker Images ───────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator
          file: ./orchestrator/Dockerfile
          tags: quantex/orchestrator:latest
          load: true

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: quantex/frontend:latest
          load: true

  # ── Notify on Failure ─────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [knowledge-integrity, lint, test, docker]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send failure notification
        run: |
          echo "::warning::QUANTEX CI/CD pipeline failed on main branch!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
