name: QUANTEX CI/CD

on:
  push:
    branches: [main, develop, 'claude/**', 'codex/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Deterministic, offline integrity gate for code/docs/ownership/embedding drift.
  knowledge-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install integrity-check dependencies
        run: pip install "pydantic>=2.5,<3"

      - name: Verify knowledge manifest and lock
        run: |
          python -m packages.knowledge.cli validate
          python scripts/knowledge.py check

  # ── Lint & Typecheck ──────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install uv==0.11.24
          uv sync --frozen --all-extras

      - name: Canonical core Ruff gate
        run: uv run --frozen ruff check packages/ workers/

      - name: Hermes and knowledge quality gates
        run: |
          uv run --frozen ruff check packages/hermes/ packages/knowledge/ scripts/benchmark_hermes.py tests/unit/test_hermes_*.py tests/integration/test_hermes_api.py
          uv run --frozen ruff format --check packages/hermes/ packages/knowledge/ scripts/benchmark_hermes.py tests/unit/test_hermes_*.py tests/integration/test_hermes_api.py
          uv run --frozen mypy packages/hermes/ --ignore-missing-imports --follow-imports=skip
          uv run --frozen mypy packages/knowledge/ --ignore-missing-imports --follow-imports=skip

      - name: Canonical core MyPy gate
        run: uv run --frozen mypy packages/ workers/ --ignore-missing-imports --explicit-package-bases

  # ── Frontend Quality ──────────────────────────────────
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frozen frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

  # ── Unit Tests ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint, knowledge-integrity]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install uv==0.11.24
          uv sync --frozen --all-extras

      - name: Run tests
        run: |
          # Keep quarantined legacy imports in a separate process so native ML
          # teardown cannot accumulate state in the canonical runtime suite.
          uv run --frozen pytest tests/contract tests/integration tests/replay tests/unit -q --timeout=60
          uv run --frozen pytest tests/test_*.py -q --timeout=60

  # ── Build Docker Images ───────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend-quality]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./orchestrator/Dockerfile
          tags: quantex/orchestrator:latest
          load: true

      - name: Build canonical local workers
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/workers/Dockerfile
          tags: quantex/canonical-workers:latest
          load: true

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: quantex/frontend:latest
          load: true

  # ── Notify on Failure ─────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [knowledge-integrity, lint, frontend-quality, test, docker]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send failure notification
        run: |
          echo "::warning::QUANTEX CI/CD pipeline failed on main branch!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
