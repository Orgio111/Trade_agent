# ═══════════════════════════════════════════════════════════
# QUANTEX — Docker Compose (Full Production Stack)
# Layer 1: Infra | Layer 2: Storage | Layer 3: Streaming
# Layer 4: Services | Layer 5-7: Application
# ═══════════════════════════════════════════════════════════

services:
  # ── LAYER 1: INFRASTRUCTURE ─────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: quantex-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: quantex
      POSTGRES_USER: quantex
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantex"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    image: redis:7.2-alpine
    container_name: quantex-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── LAYER 2-3: STORAGE + STREAMING ─────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    container_name: quantex-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ── LAYER 2-4: EVENT STREAM BUS ──────────────────────
  # NATS JetStream is the backbone of the Trinity Architecture:
  #   Layer A (Python brains) publish → signals.raw
  #   Layer B (Go orchestrator) subscribes → aggregates → signals.aggregated
  #   Layer C (Rust execution) subscribes → signals.aggregated → executes

  nats:
      image: nats:2.10-alpine
      container_name: quantex-nats
      restart: unless-stopped
      ports:
        - "4222:4222"   # Client connections (brains, orchestrator, realtime)
        - "8222:8222"   # HTTP monitoring / health
      command:
        - "--jetstream"
        - "--store_dir=/data"
        - "-m"
        - "8222"
      volumes:
        - nats_data:/data
      healthcheck:
        test: ["CMD-SHELL", "wget -q http://localhost:8222/healthz -O /dev/null || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3
      deploy:
        resources:
          limits: { cpus: "0.5", memory: 256M }

  influxdb:
    image: influxdb:2.7
    container_name: quantex-influxdb
    restart: unless-stopped
    ports: ["8086:8086"]
    volumes:
      - influx_data:/var/lib/influxdb2
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── LAYER 4-5: SERVICES ───────────────────────────────

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: quantex-orchestrator
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "8001"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      INFERENCE_BUDGET_TIER: ${INFERENCE_BUDGET_TIER:-free}
      OPENAI_API_KEY: sk-placeholder-key
      DATABASE_URL: postgresql://quantex:secret@postgres:5432/quantex
      REDIS_HOST: redis
      INITIAL_BALANCE: ${INITIAL_BALANCE:-1000.0}
      FORWARDED_ALLOW_IPS: "*"
      # Trinity Layer A: NATS JetStream — brain signals bus
      NATS_URL: nats://nats:4222
    volumes:
      - ./inference:/app/inference
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }

  # ── NEW: MICROSERVICES ────────────────────────────────

  market-data:
    build:
      context: .
      dockerfile: services/market_data/Dockerfile
    container_name: quantex-market-data
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      REDIS_HOST: redis
      POSTGRES_URL: postgresql://quantex:secret@postgres:5432/quantex
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  feature-engine:
    build:
      context: .
      dockerfile: services/feature_engine/Dockerfile
    container_name: quantex-feature-engine
    restart: unless-stopped
    ports: ["8082:8082"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  orderbook:
    build:
      context: .
      dockerfile: services/orderbook/Dockerfile
    container_name: quantex-orderbook
    restart: unless-stopped
    ports: ["8083:8083"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  moe-router:
    build:
      context: .
      dockerfile: services/moe_router/Dockerfile
    container_name: quantex-moe-router
    restart: unless-stopped
    ports: ["8084:8084"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      feature-engine:
        condition: service_started
      orderbook:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    container_name: quantex-inference
    restart: unless-stopped
    ports: ["8085:8085"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      VLLM_URL: http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      vllm:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  vllm:
    image: vllm/vllm-openai:latest
    container_name: quantex-vllm
    restart: unless-stopped
    ports: ["8000:8000"]
    # RTX 4050 laptop (6GB VRAM) — AWQ 4-bit quantized 7B model
    # Alternatives: Qwen/Qwen2.5-3B-Instruct (fp16, ~6GB) for faster inference
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --tensor-parallel-size 1
      --quantization awq
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --port 8000
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 6G }
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  execution:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    container_name: quantex-execution
    restart: unless-stopped
    ports: ["8096:8086"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      BINANCE_TESTNET: "true"
      EXECUTION_MODE: paper
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  risk:
    build:
      context: .
      dockerfile: services/risk/Dockerfile
    container_name: quantex-risk
    restart: unless-stopped
    ports: ["8087:8087"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      execution:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  rl-learning:
    build:
      context: .
      dockerfile: services/rl_learning/Dockerfile
    container_name: quantex-rl-learning
    restart: unless-stopped
    ports: ["8088:8088"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: quantex-dashboard
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
      orderbook:
        condition: service_started
      moe-router:
        condition: service_started
      execution:
        condition: service_started
      risk:
        condition: service_started
      rl-learning:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  realtime:
    build: ./realtime
    container_name: quantex-realtime
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "8082"
    environment:
      # Trinity Layer B: NATS JetStream — signal aggregation bus
      NATS_URL: nats://nats:4222
      # Brain weight overrides (optional — uncomment to customise):
      # BRAIN_WEIGHT_TIMESFM: "0.25"
      # BRAIN_WEIGHT_CUSTOM_NN: "0.04"
      # BRAIN_WEIGHT_POLYMARKET_ALPHA: "0.03"
    depends_on:
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  frontend:
    build: ./frontend
    container_name: quantex-frontend
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "3000"
    environment:
      API_TARGET: http://orchestrator:8001
      WS_TARGET: http://realtime:8082
    depends_on:
      orchestrator:
        condition: service_started
      realtime:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  # ── LAYER 6: REVERSE PROXY ────────────────────────────

  nginx:
    build: ./deployment/nginx
    container_name: quantex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      # Entrypoint writes fallback certs if LE certs don't exist yet
      - certbot_certs:/etc/letsencrypt
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-quantex.local}
    depends_on:
      frontend:
        condition: service_started
      orchestrator:
        condition: service_started
      realtime:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ── LAYER: CERTBOT — Let's Encrypt SSL Certificate Management ──
  #
  # NOTE: This service uses `profiles: [certbot]`. All certbot commands
  # MUST include --profile certbot to reference this service:
  #
  # ── One-time certificate issuance:
  #   docker compose --profile certbot run --rm certbot certonly --webroot \
  #     --webroot-path /var/www/certbot -d ${CERTBOT_DOMAIN:-quantex.local}
  #
  # ── Run renewal daemon:
  #   docker compose --profile certbot up -d
  #
  # ── Manual renewal check:
  #   docker compose --profile certbot run --rm certbot renew --dry-run
  #
  # ── Certificate status:
  #   docker compose --profile certbot run --rm certbot certificates
  #
  # After obtaining or renewing certificates, nginx auto-detects them
  # via periodic reload (every 12h).

  certbot:
    image: certbot/certbot:v2.2.0
    container_name: quantex-certbot
    profiles:
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-quantex.local}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-admin@quantex.local}
    # Renewal daemon — checks every 12 hours (43200s)
    # nginx auto-reloads every 12h via its entrypoint to pick up renewed certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap 'exit 0' TERM; while true; do certbot renew --webroot-path=/var/www/certbot --non-interactive 2>&1; echo 'Next certbot check in 12 hours...'; sleep 43200; done"
    depends_on:
      - nginx

  # ── LAYER 7-8: MONITORING ────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: quantex-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    depends_on:
      nats-exporter:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: quantex-nats-exporter
    restart: unless-stopped
    entrypoint: ["/prometheus-nats-exporter"]
    command:
      - "-connz"
      - "-routez"
      - "-subz"
      - "-varz"
      - "http://nats:8222"
    expose:
      - "7777"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  grafana:
    image: grafana/grafana:latest
    container_name: quantex-grafana
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: quantex123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nats_data:
  influx_data:
  nginx_logs:
  certbot_www:
  certbot_certs:
  prometheus_data:
  grafana_data:
