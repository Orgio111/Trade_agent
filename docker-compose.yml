# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  trading_net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  model_data:
  uds_vol:          # Shared Unix Domain Sockets (Rust <-> Go)

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── Trading Bot ──────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_agent_bot
    restart: unless-stopped
    networks: [trading_net]
    profiles: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PG_DSN=postgresql+asyncpg://trader:secret@postgres:5432/tradingdb
      - TRITON_URL=triton:8001
      - PROMETHEUS_PORT=8000
    volumes:
      - model_data:/models
    ports:
      - "8000:8000"   # Prometheus metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Redis (Streams message bus) ───────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: trade_redis
    restart: unless-stopped
    networks: [trading_net]
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL (Strategy Memory) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trade_postgres
    restart: unless-stopped
    networks: [trading_net]
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tradingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d tradingdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Sentinel-X: Rust Risk Engine ────────────────────────────────────────────
  sentinel-rust:
    build:
      context: ./sentinel-x
      dockerfile: infra/docker/Dockerfile.rust
    container_name: sentinel_risk
    restart: unless-stopped
    networks: [trading_net]
    environment:
      - RISK_UDS_PATH=/tmp/sentinel-risk.sock
      - RISK_TCP_ADDR=0.0.0.0:50051
      - INITIAL_EQUITY=100000
      - KILL_SWITCH_THRESHOLD=0.05
      - RUST_LOG=info
    volumes:
      - uds_vol:/tmp
    ports:
      - "50051:50051"   # gRPC (Python bridge)
      - "9091:9091"     # Prometheus metrics
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  # ── Sentinel-X: Go API Gateway + OMS ────────────────────────────────────────
  sentinel-go:
    build:
      context: ./sentinel-x
      dockerfile: infra/docker/Dockerfile.go
    container_name: sentinel_gateway
    restart: unless-stopped
    networks: [trading_net]
    depends_on:
      sentinel-rust:
        condition: service_started
    environment:
      - GATEWAY_ADDR=:8080
      - RISK_UDS_PATH=/tmp/sentinel-risk.sock
      - AGENT_UDS_PATH=/tmp/sentinel-agent.sock
    volumes:
      - uds_vol:/tmp
    ports:
      - "8080:8080"   # HTTP trade API
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ── NVIDIA Triton Inference Server ────────────────────────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    container_name: trade_triton
    restart: unless-stopped
    networks: [trading_net]
    profiles: [gpu]
    command: tritonserver --model-repository=/models --http-port=8080 --grpc-port=8001 --metrics-port=8002
    volumes:
      - model_data:/models
      - ./infra/triton/model_repository:/models/repo
    ports:
      - "8080:8080"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # Metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: trade_prometheus
    restart: unless-stopped
    networks: [trading_net]
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "19090:9090"

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: trade_grafana
    restart: unless-stopped
    networks: [trading_net]
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/trading.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "13000:3000"

  # ── Redis Exporter (for Prometheus) ───────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: trade_redis_exporter
    networks: [trading_net]
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "19121:9121"

  # ── Postgres Exporter ──────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: trade_postgres_exporter
    networks: [trading_net]
    environment:
      - DATA_SOURCE_NAME=postgresql://trader:secret@postgres:5432/tradingdb?sslmode=disable
    ports:
      - "19187:9187"

  # ── Node Exporter ─────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: trade_node_exporter
    networks: [trading_net]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "19100:9100"
