# ═══════════════════════════════════════════════════════════
# QUANTEX — canonical local paper/replay runtime
# The default graph is intentionally small; pre-canonical services are
# quarantined behind the explicit `legacy` profile below.
# ═══════════════════════════════════════════════════════════

# Default startup is the canonical local paper/replay runtime. Pre-canonical
# services remain available only through the explicit `legacy` profile.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-canonical-process: &canonical-process
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging: *bounded-logging

services:
  # ── LAYER 1: INFRASTRUCTURE ─────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    restart: unless-stopped
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_DB: quantex
      POSTGRES_USER: quantex
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - source: postgres_admin_password
        mode: 0400
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantex"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 256 }
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    restart: unless-stopped
    user: redis
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M, pids: 128 }
    logging: *bounded-logging
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  # ── LAYER 2-3: STORAGE + STREAMING ─────────────────────

  qdrant:
    profiles: ["legacy"]
    image: qdrant/qdrant@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  migrate:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/migrations/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-quantex}
      PGUSER: ${POSTGRES_USER:-quantex}
      PGPASSWORD_FILE: /run/secrets/postgres_admin_password
      DB_RUNTIME_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
    secrets:
      - source: postgres_admin_password
        mode: 0400
      - source: db_runtime_password
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 64 }

  chroma:
    profiles: ["knowledge"]
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: "no"
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    networks:
      - knowledge
    logging: *bounded-logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 128 }

  # ── LAYER 2-4: EVENT STREAM BUS ──────────────────────
  # NATS JetStream carries the canonical v1 boundaries:
  # raw market -> quality gate; candidate -> deterministic risk; exact
  # approval -> paper execution. No model may publish an execution command.

  nats:
      image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
      restart: unless-stopped
      ports:
        - "127.0.0.1:${NATS_PORT:-4222}:4222"
        - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
      command:
        - "--jetstream"
        - "--store_dir=/data"
        - "-m"
        - "8222"
      volumes:
        - nats_data:/data
      healthcheck:
        test: ["CMD-SHELL", "wget -q http://localhost:8222/healthz -O /dev/null || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3
      deploy:
        resources:
          limits: { cpus: "0.5", memory: 256M, pids: 128 }
      logging: *bounded-logging
      read_only: true
      cap_drop: ["ALL"]
      security_opt: ["no-new-privileges:true"]
      tmpfs:
        - /tmp:rw,noexec,nosuid,size=32m

  control-plane:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "packages.control_plane"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8001}:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RUNTIME_MODE: ${RUNTIME_MODE:-paper_live}
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      CONTROL_PLANE_PORT: "8001"
    secrets:
      - source: db_runtime_password
        mode: 0444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M, pids: 128 }

  market-data-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.market_data"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 128 }

  market-producer:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.market_producer"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M, pids: 128 }

  feature-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.features"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 128 }

  candidate-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.candidate"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
      CANDIDATE_PROVIDER: ${CANDIDATE_PROVIDER:-ollama}
      ALPHA_CANDIDATE_ARTIFACT: ${ALPHA_CANDIDATE_ARTIFACT:-}
      ALPHA_CANDIDATE_SHA256: ${ALPHA_CANDIDATE_SHA256:-}
    volumes:
      - type: bind
        source: ${ALPHA_CANDIDATE_DIRECTORY:-./.local/alpha-certification/disabled}
        target: /run/alpha-candidate
        read_only: true
    secrets:
      - source: db_runtime_password
        mode: 0444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      feature-worker:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 128 }

  reconciliation-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.reconciliation"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M, pids: 128 }

  decision-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.decision"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      reconciliation-worker:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 384M, pids: 128 }

  execution-worker:
    <<: *canonical-process
    build:
      context: .
      dockerfile: infra/workers/Dockerfile
    command: ["python", "-m", "workers.execution"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-quantex}
      DB_USER: quantex_runtime
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RUNTIME_MODE: paper_live
      ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-paper-main}
      NATS_STREAM: QUANTEX_CORE
    secrets:
      - source: db_runtime_password
        mode: 0444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M, pids: 128 }

  influxdb:
    profiles: ["legacy"]
    image: influxdb:2.7@sha256:b8d940ca9376f85118260f5b6bd236b8a00b1749c3350c5578d4cde8e27f31f2
    restart: unless-stopped
    ports: ["127.0.0.1:8086:8086"]
    volumes:
      - influx_data:/var/lib/influxdb2
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── LAYER 4-5: SERVICES ───────────────────────────────

  orchestrator:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "8001"
    environment:
      INFERENCE_BUDGET_TIER: ${INFERENCE_BUDGET_TIER:-free}
      REDIS_HOST: redis
      INITIAL_BALANCE: ${INITIAL_BALANCE:-1000.0}
      FORWARDED_ALLOW_IPS: "*"
      # Trinity Layer A: NATS JetStream — brain signals bus
      NATS_URL: nats://nats:4222
    volumes:
      - ./inference:/app/inference
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }

  # ── NEW: MICROSERVICES ────────────────────────────────

  market-data:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/market_data/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8081"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  feature-engine:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/feature_engine/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8082:8082"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  orderbook:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/orderbook/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8083:8083"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  moe-router:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/moe_router/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8084"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      feature-engine:
        condition: service_started
      orderbook:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  inference:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    restart: "no"
    ports: ["127.0.0.1:8085:8085"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      VLLM_URL: http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      vllm:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
    restart: "no"
    ports: ["127.0.0.1:8000:8000"]
    # RTX 4050 laptop (6GB VRAM) — AWQ 4-bit quantized 7B model
    # Alternatives: Qwen/Qwen2.5-3B-Instruct (fp16, ~6GB) for faster inference
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --tensor-parallel-size 1
      --quantization awq
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --port 8000
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 6G }
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  execution:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8096:8086"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      BINANCE_TESTNET: "true"
      EXECUTION_MODE: paper
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  risk:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/risk/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8087:8087"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      execution:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  rl-learning:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/rl_learning/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8088"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  dashboard:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      market-data:
        condition: service_started
      orderbook:
        condition: service_started
      moe-router:
        condition: service_started
      execution:
        condition: service_started
      risk:
        condition: service_started
      rl-learning:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  realtime:
    profiles: ["legacy"]
    build: ./realtime
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "8082"
    environment:
      # Trinity Layer B: NATS JetStream — signal aggregation bus
      NATS_URL: nats://nats:4222
      # Brain weight overrides (optional — uncomment to customise):
      # BRAIN_WEIGHT_TIMESFM: "0.25"
      # BRAIN_WEIGHT_CUSTOM_NN: "0.04"
      # BRAIN_WEIGHT_POLYMARKET_ALPHA: "0.03"
    depends_on:
      nats:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  frontend:
    profiles: ["legacy"]
    build: ./frontend
    restart: unless-stopped
    # Not exposed directly to host — accessed through nginx reverse proxy
    ports: []
    expose:
      - "3000"
    environment:
      API_TARGET: http://orchestrator:8001
      WS_TARGET: http://realtime:8082
    depends_on:
      orchestrator:
        condition: service_started
      realtime:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  # ── LAYER 6: REVERSE PROXY ────────────────────────────

  nginx:
    profiles: ["legacy"]
    build: ./deployment/nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      # Entrypoint writes fallback certs if LE certs don't exist yet
      - certbot_certs:/etc/letsencrypt
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-quantex.local}
    depends_on:
      frontend:
        condition: service_started
      orchestrator:
        condition: service_started
      realtime:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ── LAYER: CERTBOT — Let's Encrypt SSL Certificate Management ──
  #
  # NOTE: This service uses `profiles: [certbot]`. All certbot commands
  # MUST include --profile certbot to reference this service:
  #
  # ── One-time certificate issuance:
  #   docker compose --profile certbot run --rm certbot certonly --webroot \
  #     --webroot-path /var/www/certbot -d ${CERTBOT_DOMAIN:-quantex.local}
  #
  # ── Run renewal daemon:
  #   docker compose --profile certbot up -d
  #
  # ── Manual renewal check:
  #   docker compose --profile certbot run --rm certbot renew --dry-run
  #
  # ── Certificate status:
  #   docker compose --profile certbot run --rm certbot certificates
  #
  # After obtaining or renewing certificates, nginx auto-detects them
  # via periodic reload (every 12h).

  certbot:
    image: certbot/certbot:v2.2.0@sha256:f632e55104da84ba5b54bc858a67ac6c9b4f68790ea823515867c993153c3fb4
    profiles:
      - legacy
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-quantex.local}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-admin@quantex.local}
    # Renewal daemon — checks every 12 hours (43200s)
    # nginx auto-reloads every 12h via its entrypoint to pick up renewed certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap 'exit 0' TERM; while true; do certbot renew --webroot-path=/var/www/certbot --non-interactive 2>&1; echo 'Next certbot check in 12 hours...'; sleep 43200; done"
    depends_on:
      - nginx

  # ── LAYER 7-8: MONITORING ────────────────────────────

  prometheus:
    profiles: ["legacy"]
    image: prom/prometheus@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    depends_on:
      nats-exporter:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  nats-exporter:
    profiles: ["legacy"]
    image: natsio/prometheus-nats-exporter@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
    restart: unless-stopped
    entrypoint: ["/prometheus-nats-exporter"]
    command:
      - "-connz"
      - "-routez"
      - "-subz"
      - "-varz"
      - "http://nats:8222"
    expose:
      - "7777"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  grafana:
    profiles: ["legacy"]
    image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -s /run/secrets/grafana_admin_password || {
          echo "Grafana legacy profile requires a non-empty admin secret" >&2
          exit 1
        }
        exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  chroma_data:
  nats_data:
  influx_data:
  nginx_logs:
  certbot_www:
  certbot_certs:
  prometheus_data:
  grafana_data:

networks:
  knowledge:
    internal: true

secrets:
  postgres_admin_password:
    file: ${POSTGRES_PASSWORD_FILE_PATH:-.local/secrets/postgres_admin_password}
  db_runtime_password:
    file: ${DB_RUNTIME_PASSWORD_FILE_PATH:-.local/secrets/db_runtime_password}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE_PATH:-.local/secrets/grafana_admin_password}
