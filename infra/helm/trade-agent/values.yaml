# ═══════════════════════════════════════════════════════════════════════════════
#  Trade Agent — Helm Values
#  Override any value via: helm upgrade -f my-values.yaml or --set key=value
# ═══════════════════════════════════════════════════════════════════════════════

# ── Global overrides ──────────────────────────────────────────────────────────
global:
  namespace: trade-agent
  imageRegistry: ""

# ── Image configuration ────────────────────────────────────────────────────────
image:
  repository: trade-agent/python
  tag: latest
  pullPolicy: Always

# ── Trading Bot StatefulSet ───────────────────────────────────────────────────
bot:
  enabled: true
  replicas: 1
  gpu:
    enabled: true
    count: 1
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
  nodeSelector:
    nvidia.com/gpu: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# ── Web Dashboard Deployment ──────────────────────────────────────────────────
dashboard:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

# ── Redis StatefulSet ─────────────────────────────────────────────────────────
redis:
  enabled: true
  image: redis:7.2-alpine
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  persistence:
    size: 20Gi
    storageClass: standard
  config:
    maxmemory: "2gb"
    maxmemoryPolicy: allkeys-lru

# ── PostgreSQL StatefulSet ────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: postgres:16-alpine
  database: tradingdb
  user: trader
  password: changeme
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistence:
    size: 100Gi
    storageClass: standard

# ── Prometheus Monitoring ─────────────────────────────────────────────────────
prometheus:
  enabled: true
  image: prom/prometheus:v2.52.0
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  retentionDays: 30
  persistence:
    enabled: false
    size: 50Gi

# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  image: grafana/grafana:10.4.2
  adminPassword: admin
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── Postgres Exporter ─────────────────────────────────────────────────────────
postgresExporter:
  enabled: true
  image: prometheuscommunity/postgres-exporter:v0.15.0

# ── PersistentVolumeClaims ────────────────────────────────────────────────────
persistence:
  modelCache:
    size: 100Gi
    storageClass: fast-ssd
    accessMode: ReadWriteMany
  turbovec:
    size: 10Gi
    storageClass: standard
    accessMode: ReadWriteOnce

# ── Configuration ─────────────────────────────────────────────────────────────
config:
  exchange: "binance"
  exchanges: "binance,bybit,hyperliquid"
  symbols: "BTC/USDT,ETH/USDT"
  wsReconnectDelay: "2.0"

  # NIM (LLM API)
  nimBaseUrl: "http://trade-agent-ray-serve:8765/llm"
  nimEmbedModel: "nvidia/nv-embedqa-e5-v5"
  nimTimeout: "30.0"

  # Risk
  maxDailyDrawdownPct: "0.05"
  kellyFraction: "0.25"
  maxPositionPct: "0.10"
  varConfidence: "0.99"

  # Features
  featuresEnabled: "true"
  featureTradeWindowS: "60"
  featureFundingPollS: "300"
  featureOiPollS: "60"

  # MLOps
  psiDriftThreshold: "0.2"
  prometheusPort: "8000"
  logLevel: "INFO"

  # Memory
  memoryEnabled: "true"
  turbovecDimension: "768"
  turbovecMaxResults: "8"

  # Ray
  rayAddress: "ray://trade-agent-ray-head:10001"

# ── Secrets (set these via --set or external-secrets) ─────────────────────────
secrets:
  nimApiKey: ""
