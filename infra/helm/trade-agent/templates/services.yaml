{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trade-agent.fullname" . }}-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
    component: dashboard
spec:
  selector:
    {{- include "trade-agent.dashboardSelectorLabels" . | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trade-agent.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
    component: redis
spec:
  selector:
    {{- include "trade-agent.redisSelectorLabels" . | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
{{- end }}

{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trade-agent.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
    component: postgres
spec:
  selector:
    {{- include "trade-agent.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      name: pg
  type: ClusterIP
{{- end }}
