apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trade-agent.fullname" . }}-model-cache
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.modelCache.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.modelCache.size }}
  storageClassName: {{ .Values.persistence.modelCache.storageClass }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trade-agent.fullname" . }}-turbovec
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.turbovec.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.turbovec.size }}
  storageClassName: {{ .Values.persistence.turbovec.storageClass }}
