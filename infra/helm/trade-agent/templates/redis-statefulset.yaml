{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trade-agent.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
    component: redis
spec:
  replicas: 1
  serviceName: {{ include "trade-agent.fullname" . }}-redis
  selector:
    matchLabels:
      {{- include "trade-agent.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trade-agent.redisSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command:
            - redis-server
            - --maxmemory
            - {{ .Values.redis.config.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.config.maxmemoryPolicy }}
            - --save
            - "60"
            - "1"
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
        storageClassName: {{ .Values.redis.persistence.storageClass }}
{{- end }}
