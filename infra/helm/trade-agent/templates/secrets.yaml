apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trade-agent.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  nim-api-key: {{ .Values.secrets.nimApiKey | default "" | quote }}
  pg-password: {{ .Values.postgresql.password | quote }}
