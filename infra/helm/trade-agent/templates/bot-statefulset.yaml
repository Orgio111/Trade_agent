{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trade-agent.fullname" . }}-bot
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trade-agent.labels" . | nindent 4 }}
    component: bot
spec:
  replicas: {{ .Values.bot.replicas }}
  serviceName: {{ include "trade-agent.fullname" . }}-bot
  selector:
    matchLabels:
      {{- include "trade-agent.botSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trade-agent.botSelectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.config.prometheusPort | quote }}
    spec:
      {{- if .Values.bot.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.bot.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.bot.tolerations }}
      tolerations:
        {{- toYaml .Values.bot.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: bot
          image: {{ include "trade-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "trade-agent.fullname" . }}-config
          env:
            - name: NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "trade-agent.fullname" . }}-secrets
                  key: nim-api-key
            - name: PAPER_TRADING
              value: "true"
          ports:
            - containerPort: {{ .Values.config.prometheusPort }}
              name: metrics
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: {{ .Values.bot.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.bot.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: {{ .Values.bot.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.bot.probes.readiness.periodSeconds }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: turbovec-data
              mountPath: /app/.turbovec
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "trade-agent.fullname" . }}-model-cache
        - name: turbovec-data
          persistentVolumeClaim:
            claimName: {{ include "trade-agent.fullname" . }}-turbovec
{{- end }}
