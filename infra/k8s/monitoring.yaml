# ── Prometheus + Grafana Monitoring Stack ─────────────────────────────────────
# Lightweight monitoring stack for the Trade Agent on Kubernetes.
# Apply: kubectl apply -f infra/k8s/monitoring.yaml
# ──────────────────────────────────────────────────────────────────────────────

---
# ── Prometheus ConfigMap ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trade-agent
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "trade-agent-bot"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: trade-agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: "redis"
        static_configs:
          - targets: ["trade-agent-redis:6379"]

      - job_name: "postgres"
        static_configs:
          - targets: ["trade-agent-postgres-exporter:9187"]

      - job_name: "ray"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: trade-agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: ray.*
            action: keep

      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep

    alerting:
      alertmanagers: []
    rule_files:
      - /etc/prometheus/alerts.yml

  alerts.yml: |
    groups:
      - name: trade-agent
        rules:
          - alert: HighDrawdown
            expr: trade_agent_drawdown_pct > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Drawdown exceeds 5%"
              description: "Current drawdown is {{ $value }}%"

          - alert: HighLatency
            expr: agent_latency_seconds > 30
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Agent latency exceeds 30s"

          - alert: KillSwitchActive
            expr: trade_agent_kill_switch_active == 1
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Kill switch is active — trading halted"

          - alert: LowEquity
            expr: trade_agent_equity < 50000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Portfolio equity below $50,000"

---
# ── Prometheus ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: trade-agent
  labels:
    app: trade-agent
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-agent
      component: prometheus
  template:
    metadata:
      labels:
        app: trade-agent
        component: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
# ── Prometheus Service Account & ClusterRole ──────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: trade-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: trade-agent

---
# ── Prometheus Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trade-agent
spec:
  selector:
    app: trade-agent
    component: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http

---
# ── Grafana ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: trade-agent
  labels:
    app: trade-agent
    component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-agent
      component: grafana
  template:
    metadata:
      labels:
        app: trade-agent
        component: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/trading.json"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}

---
# ── Grafana Dashboard ConfigMap ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: trade-agent
data:
  trading.json: |
    {
      "title": "Trade Agent",
      "uid": "trade-agent",
      "version": 1,
      "panels": [
        {
          "title": "Portfolio Equity",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "trade_agent_equity"}]
        },
        {
          "title": "Daily PnL",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "trade_agent_daily_pnl"}]
        },
        {
          "title": "Drawdown",
          "type": "graph",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "targets": [{"expr": "trade_agent_drawdown_pct * 100"}]
        },
        {
          "title": "Agent Latency",
          "type": "heatmap",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "targets": [{"expr": "agent_latency_seconds"}]
        },
        {
          "title": "Council Consensus",
          "type": "graph",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "targets": [{"expr": "council_consensus"}]
        }
      ]
    }

---
# ── Grafana Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: trade-agent
spec:
  selector:
    app: trade-agent
    component: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP

---
# ── Postgres Exporter ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-agent-postgres-exporter
  namespace: trade-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-agent
      component: pg-exporter
  template:
    metadata:
      labels:
        app: trade-agent
        component: pg-exporter
    spec:
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://trader:changeme@trade-agent-postgres:5432/tradingdb?sslmode=disable"
          ports:
            - containerPort: 9187
              name: metrics

---
apiVersion: v1
kind: Service
metadata:
  name: trade-agent-postgres-exporter
  namespace: trade-agent
spec:
  selector:
    app: trade-agent
    component: pg-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
