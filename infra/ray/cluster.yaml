# ── Ray Cluster for Trade Agent GPU Inference ─────────────────────────────────
# Deploys a Ray cluster on Kubernetes with GPU inference workers, CPU compute
# workers, and optional H100 training workers for PPO retraining.
#
# Usage:
#   export KUBECONFIG=...
#   ray up infra/ray/cluster.yaml
#   ray down infra/ray/cluster.yaml
# ──────────────────────────────────────────────────────────────────────────────

cluster_name: trade-agent-gpu

# ── Provider (Kubernetes) ────────────────────────────────────────────────────
provider:
  type: kubernetes
  namespace: trade-agent
  use_internal_ips: true

# ── Head node (coordinator, no GPU) ──────────────────────────────────────────
head_node_type: head
head_start_ray_commands:
  - ray start --head
      --port=6379
      --object-manager-port=8076
      --dashboard-host=0.0.0.0
      --block

available_node_types:

  head:
    min_workers: 0
    max_workers: 0
    resources: {}
    node_config:
      apiVersion: v1
      kind: Pod
      spec:
        containers:
          - name: ray-head
            image: trade-agent/python:latest
            resources:
              requests:
                cpu: "4"
                memory: "8Gi"
              limits:
                cpu: "8"
                memory: "16Gi"
            env:
              - name: RAY_NODE_TYPE
                value: "head"
              - name: NIM_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: trade-agent-secrets
                    key: nim-api-key
            ports:
              - containerPort: 8265
                name: dashboard
              - containerPort: 6379
                name: gcs

  # ── GPU inference worker: LLM + embedding + PPO ─────────────────────────
  gpu-inference-worker:
    min_workers: 2
    max_workers: 8
    resources:
      GPU: 1
      InferenceGPU: 1
    node_config:
      apiVersion: v1
      kind: Pod
      spec:
        nodeSelector:
          nvidia.com/gpu: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: ray-inference-worker
            image: trade-agent/python:latest
            resources:
              requests:
                cpu: "8"
                memory: "32Gi"
                nvidia.com/gpu: "1"
              limits:
                cpu: "16"
                memory: "64Gi"
                nvidia.com/gpu: "1"
            env:
              - name: CUDA_VISIBLE_DEVICES
                value: "0"
              - name: RAY_WORKER_TYPE
                value: "inference"
              - name: NIM_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: trade-agent-secrets
                    key: nim-api-key
            volumeMounts:
              - name: model-cache
                mountPath: /models
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache-pvc
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "8Gi"

  # ── CPU compute worker: indicators, features, backtesting ───────────────
  cpu-compute-worker:
    min_workers: 2
    max_workers: 20
    resources:
      CPU_COMPUTE: 1
    node_config:
      apiVersion: v1
      kind: Pod
      spec:
        containers:
          - name: ray-cpu-worker
            image: trade-agent/python:latest
            resources:
              requests:
                cpu: "4"
                memory: "8Gi"
              limits:
                cpu: "8"
                memory: "16Gi"
            env:
              - name: RAY_WORKER_TYPE
                value: "compute"

  # ── H100 training worker: PPO retraining ────────────────────────────────
  h100-training-worker:
    min_workers: 0
    max_workers: 4
    resources:
      GPU: 1
      H100: 1
    node_config:
      apiVersion: v1
      kind: Pod
      spec:
        nodeSelector:
          node.kubernetes.io/instance-type: "p5.48xlarge"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: ray-h100-worker
            image: trade-agent/python:latest
            resources:
              requests:
                nvidia.com/gpu: "8"
                memory: "640Gi"
              limits:
                nvidia.com/gpu: "8"
                memory: "640Gi"
            env:
              - name: RAY_WORKER_TYPE
                value: "training"
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
            volumeMounts:
              - name: model-cache
                mountPath: /models
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache-pvc

# ── Autoscaling policy ────────────────────────────────────────────────────────
upscaling_speed: 2.0
idle_timeout_minutes: 5

# ── Setup commands ────────────────────────────────────────────────────────────
setup_commands:
  - pip install --upgrade "ray[serve,tune]" vllm openai numpy stable-baselines3
  - echo "Ray worker initialized"

# ── File mounts (syncs local dirs to cluster) ─────────────────────────────────
file_mounts:
  "/app/core": ./core
  "/app/agents": ./agents
  "/app/web": ./web
  "/app/memory": ./memory
  "/app/backtest": ./backtest
  "/app/mlops": ./mlops
  "/app/main.py": ./main.py
  "/app/.env": ./.env

# ── Custom resource labels ────────────────────────────────────────────────────
head_node:
  labels:
    app: trade-agent
    component: ray-head

worker_node:
  labels:
    app: trade-agent
    component: ray-worker
