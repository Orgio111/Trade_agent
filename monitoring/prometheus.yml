# QUANTEX — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "quantex-orchestrator"
    static_configs:
      - targets: ["orchestrator:8001"]
    metrics_path: "/metrics"

  - job_name: "quantex-realtime"
    static_configs:
      - targets: ["realtime:8082"]
    metrics_path: "/metrics"

  - job_name: "quantex-nats"
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - "alerts.yml"
