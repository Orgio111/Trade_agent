# ═══════════════════════════════════════════════════════════
# QUANTEX — Nginx Reverse Proxy
# Single entry point with SSL termination
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic Settings ──────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    large_client_header_buffers 4 32k;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    # ── Rate Limiting ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    # ── SSL Settings ────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upstreams ───────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 64;
    }

    upstream orchestrator_upstream {
        server orchestrator:8001;
        keepalive 64;
    }

    upstream realtime_upstream {
        server realtime:8082;
        keepalive 64;
    }

    # ── HTTPS Server (Primary) ──────────────────────────
    server {
        listen 443 ssl http2 default_server;
        server_name quantex.local _;

        # SSL certificates — Let's Encrypt (generated by certbot)
        # __DOMAIN__ placeholder is replaced by entrypoint.sh at container startup
        ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

        # ── API Proxy ──────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://orchestrator_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;

            # Strip /api prefix and add /api/v1 prefix for orchestrator
            rewrite ^/api/(.*) /api/v1/$1 break;
        }

        # ── WebSocket Proxy (Orchestrator ─ portfolio, signal, inference) ─
        location /ws {
            limit_req zone=ws burst=5 nodelay;
            proxy_pass http://orchestrator_upstream/ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket Proxy (Realtime ─ raw market data ticks) ───
        location /ws-market {
            limit_req zone=ws burst=5 nodelay;
            proxy_pass http://realtime_upstream/ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # ── Metrics ────────────────────────────────────
        location /metrics {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://orchestrator_upstream/metrics;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Internal-only — reject external requests
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ── Orchestrator API (v2 routes) ──────────────
        location /api/v2/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://orchestrator_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # ── Health Check ───────────────────────────────
        location /health {
            access_log off;
            return 200 "{\"status\":\"ok\",\"proxy\":\"nginx\"}";
            add_header Content-Type application/json;
        }

        # ── Frontend (Everything Else) ─────────────────
        location / {
            proxy_pass http://frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;

            # Next.js needs Upgrade for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Buffer settings for Server-Sent Events
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # ── HTTP → HTTPS Redirect ───────────────────────────
    server {
        listen 80 default_server;
        server_name quantex.local _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check on HTTP
        location /health {
            access_log off;
            return 200 "{\"status\":\"ok\",\"proxy\":\"nginx\"}";
            add_header Content-Type application/json;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
