# QUANTEX Service Deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-orchestrator
  namespace: quantex
  labels: { app: quantex, component: orchestrator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: quantex, component: orchestrator }
  template:
    metadata:
      labels: { app: quantex, component: orchestrator }
    spec:
      containers:
        - name: orchestrator
          image: quantex/orchestrator:latest
          ports:
            - containerPort: 8001
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantex-secrets
                  key: nvidia-api-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantex-secrets
                  key: openrouter-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quantex-secrets
                  key: database-url
            - name: REDIS_HOST
              value: "quantex-redis"
            # Trinity Layer A: NATS JetStream — 11 brain signals bus
            - name: NATS_URL
              value: "nats://quantex-nats:4222"
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-orchestrator
  namespace: quantex
spec:
  selector: { app: quantex, component: orchestrator }
  ports:
    - port: 8001
      targetPort: 8001
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-realtime
  namespace: quantex
  labels: { app: quantex, component: realtime }
spec:
  replicas: 2
  selector:
    matchLabels: { app: quantex, component: realtime }
  template:
    metadata:
      labels: { app: quantex, component: realtime }
    spec:
      containers:
        - name: realtime
          image: quantex/realtime:latest
          ports:
            - containerPort: 8082
          env:
            # Trinity Layer B: NATS JetStream — signal aggregation
            - name: NATS_URL
              value: "nats://quantex-nats:4222"
            # Brain weight overrides from ConfigMap (optional)
            - name: BRAIN_WEIGHT_TIMESFM
              valueFrom:
                configMapKeyRef:
                  name: quantex-brain-weights
                  key: brain_weight_timesfm
                  optional: true
            - name: BRAIN_WEIGHT_CUSTOM_NN
              valueFrom:
                configMapKeyRef:
                  name: quantex-brain-weights
                  key: brain_weight_custom_nn
                  optional: true
            - name: BRAIN_WEIGHT_POLYMARKET_ALPHA
              valueFrom:
                configMapKeyRef:
                  name: quantex-brain-weights
                  key: brain_weight_polymarket_alpha
                  optional: true
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
          resources:
            requests: { cpu: "0.5", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-realtime
  namespace: quantex
spec:
  selector: { app: quantex, component: realtime }
  ports:
    - port: 8082
      targetPort: 8082
      name: http
    - port: 8083
      targetPort: 8083
      name: ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-frontend
  namespace: quantex
  labels: { app: quantex, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: quantex, component: frontend }
  template:
    metadata:
      labels: { app: quantex, component: frontend }
    spec:
      containers:
        - name: frontend
          image: quantex/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: "0.5", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-frontend
  namespace: quantex
spec:
  selector: { app: quantex, component: frontend }
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
# PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantex-postgres
  namespace: quantex
spec:
  serviceName: quantex-postgres
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: postgres }
  template:
    metadata:
      labels: { app: quantex, component: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "quantex"
            - name: POSTGRES_USER
              value: "quantex"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantex-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-postgres
  namespace: quantex
spec:
  selector: { app: quantex, component: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-redis
  namespace: quantex
spec:
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: redis }
  template:
    metadata:
      labels: { app: quantex, component: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-redis
  namespace: quantex
spec:
  selector: { app: quantex, component: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
# Prometheus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-prometheus
  namespace: quantex
spec:
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: prometheus }
  template:
    metadata:
      labels: { app: quantex, component: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: quantex-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-prometheus
  namespace: quantex
spec:
  selector: { app: quantex, component: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
---
# ── Brain Weights ConfigMap ────────────────────────────────
# Maps brain IDs to their weights for the Trinity Architecture.
# The Go orchestrator (quantex-realtime) uses these via env var overrides.
# Total should sum to 1.00. Override any brain weight by uncommenting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantex-brain-weights
  namespace: quantex
  labels: { app: quantex, component: brains }
data:
  # All 11 Trinity Architecture brains with default weights
  # BRAIN_WEIGHT_<ID> env vars override the Go config.go defaults
  brain_weight_timesfm: "0.25"
  brain_weight_freqai: "0.15"
  brain_weight_llm_regime: "0.15"
  brain_weight_microstructure: "0.08"
  brain_weight_orderflow_nautilus: "0.08"
  brain_weight_finbert: "0.07"
  brain_weight_finrl: "0.07"
  brain_weight_statarb: "0.05"
  brain_weight_onchain: "0.03"
  brain_weight_custom_nn: "0.04"
  brain_weight_polymarket_alpha: "0.03"
---
# NATS JetStream — Trinity Architecture Event Backbone
#   Layer A (Python brains)  publish → signals.raw
#   Layer B (Go orchestrator) subscribes → aggregates → signals.aggregated
#   Layer C (Rust execution)  subscribes → signals.aggregated → executes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-nats
  namespace: quantex
  labels: { app: quantex, component: nats }
spec:
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: nats }
  template:
    metadata:
      labels: { app: quantex, component: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "-m"
            - "8222"
            - "--max_payload=1MB"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          livenessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: "0.25", memory: "256Mi" }
            limits: { cpu: "0.5", memory: "512Mi" }
          volumeMounts:
            - name: nats-data
              mountPath: /data
      volumes:
        - name: nats-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-nats
  namespace: quantex
  labels: { app: quantex, component: nats }
spec:
  selector: { app: quantex, component: nats }
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
# NATS Prometheus Exporter (optional — metrics for Prometheus)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-nats-exporter
  namespace: quantex
  labels: { app: quantex, component: nats-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: nats-exporter }
  template:
    metadata:
      labels: { app: quantex, component: nats-exporter }
    spec:
      containers:
        - name: nats-exporter
          image: natsio/prometheus-nats-exporter:latest
          args:
            - "-connz"
            - "-routez"
            - "-subz"
            - "-varz"
            - "http://quantex-nats:8222"
          ports:
            - containerPort: 7777
              name: metrics
          resources:
            requests: { cpu: "0.1", memory: "64Mi" }
            limits: { cpu: "0.25", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-nats-exporter
  namespace: quantex
  labels: { app: quantex, component: nats-exporter }
spec:
  selector: { app: quantex, component: nats-exporter }
  ports:
    - name: metrics
      port: 7777
      targetPort: 7777
---
# Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantex-grafana
  namespace: quantex
spec:
  replicas: 1
  selector:
    matchLabels: { app: quantex, component: grafana }
  template:
    metadata:
      labels: { app: quantex, component: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantex-secrets
                  key: grafana-admin-password
---
apiVersion: v1
kind: Service
metadata:
  name: quantex-grafana
  namespace: quantex
spec:
  selector: { app: quantex, component: grafana }
  ports:
    - port: 3000
      targetPort: 3000
