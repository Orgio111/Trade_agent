schema_version = 1
project = "Trade_agent"

[knowledge]
source_of_truth = "wiki"
embedding_provider = "ollama"
embedding_model = "nomic-embed-text"
embedding_dimension = 768
model_digest_policy = "runtime_locked"
ollama_base_url = "http://127.0.0.1:11434"
vector_store = "chromadb"
chroma_host = "127.0.0.1"
chroma_port = 8100
chroma_ssl = false
chroma_client_version = "1.5.9"
chroma_server_image = "chromadb/chroma:1.5.9"
collection = "trade-agent-project-knowledge-v1"
lock_file = "project.manifest.lock.json"
receipt_file = ".local/knowledge/sync-receipt.json"
chunker_version = "char-lines-v1"
max_chunk_chars = 4000
overlap_chars = 400
embedding_batch_size = 16
upsert_batch_size = 64

[runtime_policy]
local_inference_hosts = [
  "127.0.0.1",
  "::1",
  "localhost",
  "host.docker.internal",
]
allowed_models = [
  "qwen3:8b",
  "phi3:3.8b",
  "deepseek-r1:8b",
  "moondream",
  "mistral",
  "nomic-embed-text",
]
allowed_modes = ["offline", "paper_live", "replay", "research"]

[coverage]
include = [
  "project.manifest.toml",
  "project.manifest.lock.json",
  "packages/**/*.py",
  "packages/**/*.json",
  "orchestrator/**/*.py",
  "orchestrator/brains/*.json",
  "**/.dockerignore",
  "orchestrator/Dockerfile",
  "orchestrator/requirements.txt",
  "inference/**/*.py",
  "workers/**/*.py",
  "binance/**/*.py",
  "notifications/**/*.py",
  "services/**/*.py",
  "services/**/Dockerfile",
  "services/**/requirements.txt",
  "realtime/**/*.go",
  "realtime/Dockerfile",
  "realtime/go.mod",
  "realtime/go.sum",
  "execution/src/**/*.rs",
  "execution/Cargo.toml",
  "execution/Cargo.lock",
  "frontend/src/**/*.ts",
  "frontend/src/**/*.tsx",
  "frontend/src/**/*.css",
  "frontend/tests/**/*.ts",
  "frontend/*.ts",
  "frontend/*.mjs",
  "frontend/Dockerfile",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/tsconfig.json",
  "strategies/**/*.json",
  "scripts/**/*.py",
  "Trade_agent/**/*.py",
  "tests/**/*.py",
  "*.py",
  ".github/workflows/*.yml",
  "docker-compose*.yml",
  "config/**/*.yaml",
  "config_dir/**/*.yaml",
  "config_dir/**/*.py",
  "config.yaml",
  "db/migrations/**/*.sql",
  "deployment/**/*.yaml",
  "deployment/**/*.tf",
  "deployment/**/*.sh",
  "deployment/**/*.conf",
  "deployment/**/Dockerfile",
  "infra/**/*.yml",
  "infra/**/Dockerfile",
  "monitoring/**/*.yml",
  "monitoring/**/*.json",
  "pyproject.toml",
  "requirements.txt",
  "uv.lock",
  ".gitignore",
  "AGENTS.md",
  "README.md",
  "CHANGELOG.md",
  "install.ps1",
  "wiki/ZCODE.md",
  "wiki/README.md",
  "wiki/index.md",
  "wiki/log.md",
  "wiki/content/**/*.md",
]
tracked_include = [
  "**/*.py",
  "**/*.go",
  "**/*.rs",
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.jsx",
  "**/*.mjs",
  "**/*.cjs",
  "**/*.css",
  "**/*.scss",
  "**/*.sql",
  "**/*.toml",
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.tf",
  "**/*.hcl",
  "**/*.sh",
  "**/*.ps1",
  "**/*.md",
  "**/*.conf",
  "**/*.ini",
  "**/*.proto",
  "**/Dockerfile",
  "Dockerfile",
  "**/Makefile",
  "Makefile",
  "**/.dockerignore",
  ".dockerignore",
  "**/Cargo.lock",
  "Cargo.lock",
  "**/go.mod",
  "go.mod",
  "**/go.sum",
  "go.sum",
  "**/requirements*.txt",
  "requirements*.txt",
]
tracked_exclude = [
  ".obsidian/**/*",
  ".pytest_tmp*/**/*",
  ".venv/**/*",
  "**/__pycache__/**/*",
  "**/.pytest_cache/**/*",
  "frontend/node_modules/**/*",
  "frontend/test-results/**/*",
  "execution/target/**/*",
  "build/**/*",
  "dist/**/*",
  ".local/**/*",
  ".chroma/**/*",
  "chroma-data/**/*",
  "backtest_results/**/*",
  "data/**/*",
  "logs/**/*",
  "models/**/*",
  "raw/**/*",
  "wiki/raw/**/*",
  # Legacy pre-vault notes remain readable but are not durable project docs.
  "wiki/AutoGen Trading Pipeline.md",
  "wiki/Backtest Engine.md",
  "wiki/CLI Reference.md",
  "wiki/Enhanced Risk Engine.md",
  "wiki/Model Loader VRAM Strategy.md",
  "wiki/Troubleshooting.md",
  "wiki/Wiki Index.md",
  "wiki/agents.md",
]
forbidden_repository_paths = [
  "**/*.sqlite3",
  "**/.env",
  "**/.env.*",
  ".pytest_tmp*/**/*",
  ".local/**/*",
  ".chroma/**/*",
  "chroma-data/**/*",
]
legacy_repository_exceptions = [
  ".env.example",
  "memory/chroma.sqlite3",
]

[[components]]
id = "knowledge-pipeline"
owner = "software-engineering/knowledge"
primary_responsibility = "Build and verify the local project-knowledge projection."
runtime_status = "active"
entrypoints = [
  { path = "scripts/knowledge.py", kind = "cli", default = true },
]
authorities = [
  { id = "inference.project-embedding", sensitive = true },
  { id = "knowledge.projection", sensitive = true },
]
allowed_modes = ["offline"]
allowed_egress = [
  "http://127.0.0.1:11434",
  "http://127.0.0.1:8100",
]
allowed_models = ["nomic-embed-text"]
license = { expression = "NOASSERTION", source = "none-declared" }
owned_paths = [
  "project.manifest.toml",
  "project.manifest.lock.json",
  "packages/knowledge/**/*.py",
  "scripts/knowledge.py",
  "scripts/benchmark_knowledge.py",
  "tests/fakes/**/*.py",
  "tests/unit/test_knowledge_*.py",
  "tests/integration/test_knowledge_*.py",
]
tests = [
  "tests/unit/test_knowledge_*.py",
  "tests/integration/test_knowledge_*.py",
]
documentation = [
  "wiki/content/playbooks/local-knowledge-pipeline-operations.md",
]
architecture = [
  "wiki/content/decisions/local-knowledge-pipeline-v1.md",
]
embedding_inputs = [
  "project.manifest.toml",
  "packages/knowledge/**/*.py",
  "scripts/knowledge.py",
  "scripts/benchmark_knowledge.py",
]
forbidden_imports = [
  "anthropic",
  "google",
  "ollama",
  "openai",
  "qdrant_client",
  "sentence_transformers",
]

