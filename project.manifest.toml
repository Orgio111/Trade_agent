schema_version = 1
project = "Trade_agent"

[knowledge]
source_of_truth = "wiki"
embedding_provider = "ollama"
embedding_model = "nomic-embed-text"
embedding_dimension = 768
model_digest_policy = "runtime_locked"
ollama_base_url = "http://127.0.0.1:11434"
vector_store = "chromadb"
chroma_host = "127.0.0.1"
chroma_port = 8100
chroma_ssl = false
chroma_client_version = "1.5.9"
chroma_server_image = "chromadb/chroma:1.5.9"
collection = "trade-agent-project-knowledge-v1"
lock_file = "project.manifest.lock.json"
receipt_file = ".local/knowledge/sync-receipt.json"
chunker_version = "char-lines-v1"
max_chunk_chars = 4000
overlap_chars = 400
embedding_batch_size = 16
upsert_batch_size = 64

[coverage]
include = [
  "project.manifest.toml",
  "project.manifest.lock.json",
  "packages/**/*.py",
  "orchestrator/**/*.py",
  "orchestrator/.dockerignore",
  "orchestrator/Dockerfile",
  "orchestrator/requirements.txt",
  "inference/**/*.py",
  "workers/**/*.py",
  "binance/**/*.py",
  "notifications/**/*.py",
  "services/**/*.py",
  "services/**/Dockerfile",
  "services/**/requirements.txt",
  "realtime/**/*.go",
  "realtime/Dockerfile",
  "realtime/go.mod",
  "realtime/go.sum",
  "execution/src/**/*.rs",
  "execution/Cargo.toml",
  "frontend/src/**/*.ts",
  "frontend/src/**/*.tsx",
  "frontend/src/**/*.css",
  "frontend/tests/**/*.ts",
  "frontend/*.ts",
  "frontend/Dockerfile",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/tsconfig.json",
  "strategies/**/*.json",
  "scripts/**/*.py",
  "tests/**/*.py",
  "*.py",
  ".github/workflows/*.yml",
  "docker-compose*.yml",
  "config/**/*.yaml",
  "config_dir/**/*.yaml",
  "config.yaml",
  "db/migrations/**/*.sql",
  "deployment/**/*.yaml",
  "deployment/**/*.tf",
  "deployment/**/*.sh",
  "deployment/**/*.conf",
  "deployment/**/Dockerfile",
  "infra/**/*.yml",
  "infra/**/Dockerfile",
  "monitoring/**/*.yml",
  "monitoring/**/*.json",
  "pyproject.toml",
  "requirements.txt",
  "uv.lock",
  ".gitignore",
  "AGENTS.md",
  "README.md",
  "CHANGELOG.md",
  "wiki/ZCODE.md",
  "wiki/index.md",
  "wiki/log.md",
  "wiki/content/**/*.md",
]
forbidden_repository_paths = [
  "**/*.sqlite3",
  "**/.env",
  "**/.env.*",
  ".local/**/*",
  ".chroma/**/*",
  "chroma-data/**/*",
]
legacy_repository_exceptions = [
  ".env.example",
  "memory/chroma.sqlite3",
]

[[components]]
id = "knowledge-pipeline"
owner = "software-engineering/knowledge"
primary_responsibility = "Build and verify the local project-knowledge projection."
owned_paths = [
  "project.manifest.toml",
  "project.manifest.lock.json",
  "packages/knowledge/**/*.py",
  "scripts/knowledge.py",
  "scripts/benchmark_knowledge.py",
  "tests/fakes/**/*.py",
  "tests/unit/test_knowledge_*.py",
  "tests/integration/test_knowledge_*.py",
]
tests = [
  "tests/unit/test_knowledge_*.py",
  "tests/integration/test_knowledge_*.py",
]
documentation = [
  "wiki/content/playbooks/local-knowledge-pipeline-operations.md",
]
architecture = [
  "wiki/content/decisions/local-knowledge-pipeline-v1.md",
]
embedding_inputs = [
  "project.manifest.toml",
  "packages/knowledge/**/*.py",
  "scripts/knowledge.py",
  "scripts/benchmark_knowledge.py",
]
forbidden_imports = [
  "anthropic",
  "google",
  "ollama",
  "openai",
  "qdrant_client",
  "sentence_transformers",
]

[[components]]
id = "deterministic-paper-core"
owner = "software-engineering/core"
primary_responsibility = "Provide deterministic paper and replay safety semantics."
owned_paths = [
  "packages/brokers/**/*.py",
  "packages/data_quality/**/*.py",
  "packages/domain/**/*.py",
  "packages/event_bus/**/*.py",
  "packages/event_contracts/**/*.py",
  "packages/execution/**/*.py",
