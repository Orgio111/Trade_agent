  "tests/unit/test_data_quality.py",
  "tests/unit/test_execution_core.py",
  "tests/unit/test_risk_engine.py",
  "tests/integration/test_decision_vertical_slice.py",
  "tests/integration/test_replay_cli.py",
]
tests = [
  "tests/contract/**/*.py",
  "tests/replay/**/*.py",
  "tests/unit/test_data_quality.py",
  "tests/unit/test_execution_core.py",
  "tests/unit/test_risk_engine.py",
  "tests/integration/test_decision_vertical_slice.py",
]
documentation = [
  "wiki/content/concepts/broker-abstraction-layer.md",
]
architecture = [
  "wiki/content/decisions/deterministic-paper-core-v1.md",
]
embedding_inputs = [
  "packages/brokers/**/*.py",
  "packages/data_quality/**/*.py",
  "packages/domain/**/*.py",
  "packages/event_bus/**/*.py",
  "packages/event_contracts/**/*.py",
  "packages/execution/**/*.py",
  "packages/replay/**/*.py",
  "packages/risk/**/*.py",
  "packages/strategies/**/*.py",
]

