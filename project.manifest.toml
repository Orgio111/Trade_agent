[[components]]
id = "database-migrations"
owner = "software-engineering/database"
primary_responsibility = "Evolve the durable database schema deterministically."
runtime_status = "active"
entrypoints = [
  { path = "scripts/apply_migrations.py", kind = "cli", default = true },
]
authorities = [
  { id = "database.schema-migration", sensitive = true },
]
allowed_modes = ["offline", "paper_live", "replay"]
allowed_egress = ["postgresql://127.0.0.1:5432"]
event_contracts = [
  { id = "risk-decision", version = "1.0", role = "stores" },
  { id = "order-intent", version = "1.0", role = "stores" },
  { id = "order-update", version = "1.0", role = "stores" },
]
license = { expression = "NOASSERTION", source = "none-declared" }
owned_paths = [
  "db/migrations/**/*.sql",
  "scripts/apply_migrations.py",
  "tests/contract/test_execution_migration.py",
  "tests/contract/test_migration_runner.py",
  "tests/contract/test_runtime_durability_migration.py",
]
tests = [
  "tests/contract/test_execution_migration.py",
  "tests/contract/test_migration_runner.py",
  "tests/contract/test_runtime_durability_migration.py",
]
documentation = [
  "wiki/content/playbooks/local-ai-deployment-guide.md",
]
architecture = [
  "wiki/content/decisions/deterministic-paper-core-v1.md",
]
embedding_inputs = [
  "db/migrations/**/*.sql",
  "scripts/apply_migrations.py",
]

