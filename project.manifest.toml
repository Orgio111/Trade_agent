[[quarantines]]
id = "legacy-trading-vector-systems"
reason = "Trading-memory vector paths are outside this project-knowledge migration."
scope = [
  "memory.py",
  "inference/cache.py",
  "orchestrator/rag_agent.py",
  "orchestrator/memory/vector_memory.py",
  "orchestrator/rl_memory/**/*.py",
  "orchestrator/rl_streaming/**/*.py",
  "orchestrator/nim_*.py",
  "orchestrator/inference_integration.py",
]
baseline_paths = [
  "inference/cache.py",
  "memory.py",
  "orchestrator/inference_integration.py",
  "orchestrator/memory/vector_memory.py",
  "orchestrator/nim_client.py",
