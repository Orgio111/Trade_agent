syntax = "proto3";
package sentinelx.orders;
option go_package = "github.com/sentinelx/go/pkg/proto/orders";

enum OrderSide   { BUY = 0; SELL = 1; }
enum OrderType   { MARKET = 0; LIMIT = 1; TWAP = 2; VWAP = 3; }
enum OrderStatus { PENDING = 0; OPEN = 1; FILLED = 2; PARTIALLY_FILLED = 3; CANCELLED = 4; REJECTED = 5; }

message Order {
  string      order_id           = 1;
  string      session_id         = 2;
  string      symbol             = 3;
  OrderSide   side               = 4;
  OrderType   order_type         = 5;
  double      quantity           = 6;
  double      limit_price        = 7;
  double      stop_price         = 8;
  OrderStatus status             = 9;
  double      avg_fill_price     = 10;
  double      slippage_bps       = 11;
  string      supervisor_rationale = 12;
  int64       created_at_ns      = 13;
  int64       filled_at_ns       = 14;
}

message OrderRequest {
  Order  order       = 1;
  bytes  sbe_payload = 2;  // SBE-encoded risk snapshot for audit
}

message OrderResponse {
  Order  order            = 1;
  string exchange_order_id = 2;
  string error            = 3;
}

message CancelRequest  { string order_id = 1; string reason = 2; }
message CancelResponse { bool success = 1; string error = 2; }

service OrderManagement {
  rpc SubmitOrder(OrderRequest)   returns (OrderResponse);
  rpc CancelOrder(CancelRequest)  returns (CancelResponse);
  rpc StreamFills(stream OrderRequest) returns (stream OrderResponse);
}
