---
# ── Sentinel-X Python Brain (Agent Council) ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-python
  namespace: sentinel-x
  labels:
    app: sentinel-python
    tier: brain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-python
  template:
    metadata:
      labels:
        app: sentinel-python
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sentinel-python
          image: sentinel-x/python:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "16Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
          env:
            - name: NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: nim-api-key
            - name: NIM_BASE_URL
              value: "https://integrate.api.nvidia.com/v1"
            - name: GATEWAY_URL
              value: "http://sentinel-go:8080"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: pg-dsn
            - name: RISK_UDS_PATH
              value: "/tmp/sentinel-risk.sock"
            - name: AGENT_UDS_PATH
              value: "/tmp/sentinel-agent.sock"
          volumeMounts:
            - name: uds-vol
              mountPath: /tmp
            - name: model-cache
              mountPath: /data
          ports:
            - containerPort: 8001
              name: metrics
      volumes:
        - name: uds-vol
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
      initContainers:
        - name: wait-for-risk
          image: busybox:1.36
          command: ["sh", "-c", "until test -S /tmp/sentinel-risk.sock; do sleep 1; done"]
          volumeMounts:
            - name: uds-vol
              mountPath: /tmp

---
# ── Sentinel-X Go Heart (Gateway + OMS) ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-go
  namespace: sentinel-x
  labels:
    app: sentinel-go
    tier: heart
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-go
  template:
    metadata:
      labels:
        app: sentinel-go
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: sentinel-go
          image: sentinel-x/go:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          env:
            - name: GATEWAY_ADDR
              value: ":8080"
            - name: RISK_UDS_PATH
              value: "/tmp/sentinel-risk.sock"
            - name: AGENT_UDS_PATH
              value: "/tmp/sentinel-agent.sock"
          volumeMounts:
            - name: uds-vol
              mountPath: /tmp
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: uds-vol
          emptyDir: {}

---
# ── Sentinel-X Rust Shield (Risk Engine) ─────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-rust
  namespace: sentinel-x
  labels:
    app: sentinel-rust
    tier: shield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-rust
  template:
    metadata:
      labels:
        app: sentinel-rust
    spec:
      containers:
        - name: sentinel-rust
          image: sentinel-x/rust:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "8"
          env:
            - name: RISK_UDS_PATH
              value: "/tmp/sentinel-risk.sock"
            - name: INITIAL_EQUITY
              value: "100000"
            - name: KILL_SWITCH_THRESHOLD
              value: "0.05"
          volumeMounts:
            - name: uds-vol
              mountPath: /tmp
          ports:
            - containerPort: 9091
              name: metrics
      volumes:
        - name: uds-vol
          emptyDir: {}

---
# ── NVIDIA Triton Inference Server ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: sentinel-x
  labels:
    app: triton
    tier: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          args:
            - tritonserver
            - --model-repository=/models
            - --http-port=8080
            - --grpc-port=8001
            - --metrics-port=8002
            - --allow-gpu-metrics=true
            - --dynamic-batching
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "4"
            limits:
              memory: "64Gi"
              cpu: "16"
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model-repo
              mountPath: /models
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: model-repo
          persistentVolumeClaim:
            claimName: triton-models-pvc

---
# ── Services ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sentinel-go
  namespace: sentinel-x
spec:
  selector:
    app: sentinel-go
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: sentinel-x
spec:
  selector:
    app: triton
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8001
      targetPort: 8001
      name: grpc
  type: ClusterIP
