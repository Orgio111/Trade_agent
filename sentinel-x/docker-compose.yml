version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  sentinel_net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  model_data:
  faiss_data:
  uds_vol:    # Shared Unix Domain Sockets between all services

services:

  # ── Rust Shield: Risk Engine ──────────────────────────────────────────────
  sentinel-rust:
    build:
      context: ..
      dockerfile: sentinel-x/infra/docker/Dockerfile.rust
    container_name: sentinel_risk
    restart: unless-stopped
    networks: [sentinel_net]
    environment:
      - RISK_UDS_PATH=/tmp/sentinel-risk.sock
      - INITIAL_EQUITY=100000
      - KILL_SWITCH_THRESHOLD=0.05
      - RUST_LOG=info
    volumes:
      - uds_vol:/tmp
    ports:
      - "9091:9091"   # Prometheus metrics
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 4G

  # ── Go Heart: API Gateway + OMS ──────────────────────────────────────────
  sentinel-go:
    build:
      context: ..
      dockerfile: sentinel-x/infra/docker/Dockerfile.go
    container_name: sentinel_gateway
    restart: unless-stopped
    networks: [sentinel_net]
    depends_on:
      sentinel-rust:
        condition: service_started
    environment:
      - GATEWAY_ADDR=:8080
      - RISK_UDS_PATH=/tmp/sentinel-risk.sock
      - AGENT_UDS_PATH=/tmp/sentinel-agent.sock
    volumes:
      - uds_vol:/tmp
    ports:
      - "8080:8080"   # HTTP API gateway
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  # ── Python Brain: Agent Council ───────────────────────────────────────────
  sentinel-python:
    build:
      context: ..
      dockerfile: sentinel-x/infra/docker/Dockerfile.python
    container_name: sentinel_brain
    restart: unless-stopped
    networks: [sentinel_net]
    depends_on:
      - sentinel-go
      - redis
      - postgres
    env_file: ../.env
    environment:
      - GATEWAY_URL=http://sentinel-go:8080
      - REDIS_URL=redis://redis:6379/0
      - PG_DSN=postgresql+asyncpg://sentinel:secret@postgres:5432/sentineldb
      - RISK_UDS_PATH=/tmp/sentinel-risk.sock
      - AGENT_UDS_PATH=/tmp/sentinel-agent.sock
      - TRITON_URL=triton:8001
      - FAISS_DATA_PATH=/data/strategy_memory.faiss
    volumes:
      - uds_vol:/tmp
      - faiss_data:/data
    ports:
      - "8001:8001"   # Prometheus metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── NVIDIA Triton Inference Server ─────────────────────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    container_name: sentinel_triton
    restart: unless-stopped
    networks: [sentinel_net]
    command: >
      tritonserver
        --model-repository=/models
        --http-port=8082
        --grpc-port=8001
        --metrics-port=8003
        --allow-gpu-metrics=true
    volumes:
      - model_data:/models
    ports:
      - "8082:8082"
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Redis (message bus) ────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    networks: [sentinel_net]
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL (strategy memory) ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    networks: [sentinel_net]
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sentineldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentineldb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinel_prometheus
    restart: unless-stopped
    networks: [sentinel_net]
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: sentinel_grafana
    restart: unless-stopped
    networks: [sentinel_net]
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sentinel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
