[package]
name        = "sentinel-exec"
version     = "1.0.0"
edition     = "2021"
description = "Sentinel-X Sub-10ms Execution Engine"

[[bin]]
name = "sentinel-exec"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1.38", features = ["full", "parking_lot"] }
crossbeam      = { version = "0.8", features = ["crossbeam-channel", "crossbeam-queue"] }
crossbeam-channel = "0.5"
parking_lot    = "0.12"    # 3-5x faster than std::sync::Mutex
dashmap        = "6"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
bytes          = "1"
prometheus     = "0.13"
tracing        = "0.1"
tracing-subscriber = "0.3"
anyhow         = "1"
libc           = "0.2"     # For CPU affinity syscalls
core_affinity  = "0.8"     # Thread pinning
tonic          = "0.11"
prost          = "0.12"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"

# Enable SIMD for price comparison
[target.'cfg(target_arch = "x86_64")'.dependencies]
# SIMD batch quote comparison — no extra dep needed, std::arch suffices
