[package]
name        = "sentinel-arb"
version     = "1.0.0"
edition     = "2021"
description = "Sentinel-X Multi-Exchange Arbitrage Engine"

[[bin]]
name = "sentinel-arb"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures        = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
anyhow         = "1"
thiserror      = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus     = "0.13"
dashmap        = "6"       # Lock-free concurrent HashMap
crossbeam      = "0.8"     # Lock-free channels
rust_decimal   = { version = "1.35", features = ["serde-float"] }
ordered-float  = "4"
bytes          = "1"
uuid           = { version = "1", features = ["v4"] }
url            = "2"
reqwest        = { version = "0.12", features = ["json"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
